# GitLab (gitlab.com/sambor88/<nazwa-repo>) jest źródłem prawdy. GitLab sam kopiuje swoje chronione
# gałęzie (main, dev) na GitHub przez push mirror (Settings → Repository → Mirroring repositories).
#
# Ten workflow przenosi w drugą stronę tylko gałęzie claude/*, bo sesje Claude Code w chmurze
# i Claude Design pushują na GitHub. Na GitLabie z takiej gałęzi otwiera się merge request.
# Gałęzi main, dev ani tagów stąd nie wypychamy — nadpisałyby pracę z GitLaba.
#
# Wymaga tokena GitLab z zakresem write_repository w sekrecie GITLAB_TOKEN albo GITHUB
# (Settings → Secrets and variables → Actions). Bez tokena workflow niczego nie robi.
name: Mirror claude branches to GitLab

on:
  push:
    branches:
      - 'claude/**'
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-mirror-${{ github.event_name == 'delete' && format('delete-{0}', github.event.ref) || 'sync' }}
  cancel-in-progress: false

env:
  GITLAB_NAMESPACE: gitlab.com/sambor88

jobs:
  mirror:
    # Zdarzenie delete nie ma filtra gałęzi, więc sprawdzamy nazwę tutaj.
    if: >-
      github.actor != 'dependabot[bot]' && !github.event.deleted &&
      (github.event_name != 'delete' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'claude/')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pobierz wszystkie gałęzie
        if: github.event_name != 'delete'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Wypchnij gałęzie claude/* na GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN || secrets.GITHUB }}
          EVENT: ${{ github.event_name }}
          DELETED_REF: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::warning::Brak tokena GitLab (sekret GITLAB_TOKEN albo GITHUB), kopia na GitLab jest wyłączona"
            exit 0
          fi
          # GitLab nie przyjmie ścieżki z kilkoma znakami specjalnymi z rzędu ani na jej brzegach.
          project=$(echo "${GITHUB_REPOSITORY#*/}" | sed -E 's/[-_.]{2,}/-/g; s/^[-_.]+//; s/[-_.]+$//')
          url="https://${GITLAB_NAMESPACE}/${project}.git"
          export GIT_TERMINAL_PROMPT=0

          # Token trafia do gita przez credential helper, nigdy do URL-a ani argumentów.
          gitlab() {
            git -c credential.helper= \
                -c credential.helper='!f() { echo username=oauth2; echo "password=${GITLAB_TOKEN}"; }; f' \
                "$@"
          }

          if [ "$EVENT" = delete ]; then
            git init -q
            ref="refs/heads/$DELETED_REF"
            rc=0
            gitlab ls-remote --exit-code "$url" "$ref" > /dev/null || rc=$?
            case "$rc" in
              0) gitlab push "$url" --delete "$ref" ;;
              2) echo "$ref nie istnieje na GitLabie, nie ma czego usuwać" ;;
              *) exit "$rc" ;;
            esac
          else
            # ci.skip: kopia nie uruchamia pipeline'ów GitLaba przy pushu; merge request uruchomi je sam.
            gitlab push -o ci.skip "$url" '+refs/remotes/origin/claude/*:refs/heads/claude/*'
          fi
